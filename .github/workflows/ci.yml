name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.7.2
      # ENGINE-015: single source of truth — run_gate.sh 'all' executes the
      # mandatory import pass, gdlint advisory, and every gate added since
      # ENGINE-009 (content, engine, save-compat, perf-budget, shaders,
      # touch-targets, profiler, frame-cap, memory, crafting, game-flow,
      # festival, buffalo, planting, banana, stage-render, songkran, audio,
      # save-ui). Keep adding suites to run_gate.sh, not here.
      - name: Full gate sweep
        run: bash scripts/ci/run_gate.sh all
